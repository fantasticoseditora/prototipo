name: Jornada frontend automated tests

on:
  pull_request:
    paths:
      - 'jornada-90-dias/**'
      - '.github/workflows/jornada-frontend-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'jornada-90-dias/**'
      - '.github/workflows/jornada-frontend-tests.yml'

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jornada-90-dias
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start local frontend
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jornada-frontend.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jornada-frontend.log
          exit 1

      - name: Run browser regression tests
        run: npm test

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/jornada-frontend.log || true
