<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050a1c"><title>Selene — Rafael A. F. Silva</title><style>html,body{margin:0;min-height:100%;background:#030616;color:#eaf8ff;font-family:system-ui,sans-serif;display:grid;place-items:center}.boot{display:grid;place-items:center;gap:16px;text-align:center}.orb{width:58px;height:58px;border:2px solid #64d9ff;border-right-color:transparent;border-radius:50%;animation:r 1s linear infinite;box-shadow:0 0 28px #2745a7}.boot small{color:#9bb1ca;letter-spacing:.12em}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="boot"><div class="orb"></div><strong>IAN INICIALIZANDO</strong><small>CARREGANDO ESTAÇÃO GALILEO</small></div><script>(async()=>{try{const [p,c]=await Promise.all([fetch('site.gz.b64').then(r=>r.text()),fetch('cover.b64').then(r=>r.text())]);const bin=Uint8Array.from(atob(p.trim()),x=>x.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replaceAll('__COVER_DATA__','data:image/jpeg;base64,'+c.trim());document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><strong>Falha ao iniciar IAN</strong><small>Recarregue a página.</small></div>';console.error(e)}})();</script></body></html>
